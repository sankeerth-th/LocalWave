name: LocalWave
options:
  bundleIdPrefix: com.localwave
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
targets:
  LocalWave:
    type: application
    platform: iOS
    info:
      path: LocalWave/Resources/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.localwave.package
            UTTypeDescription: LocalWave Encrypted Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - localwavepkg
              public.mime-type:
                - application/vnd.localwave.package
        CFBundleDocumentTypes:
          - CFBundleTypeName: LocalWave Encrypted Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.localwave.package
        LSSupportsOpeningDocumentsInPlace: true
    sources:
      - path: LocalWave
        excludes:
          - Features/PeopleView.swift
          - Features/Chat/ChatConversationView.swift
          - Features/Chat/ChatListView.swift
          - Features/Chat/ChatListViewModel.swift
          - Features/Frequency/FrequencyInfoSheet.swift
    resources:
      - path: LocalWave/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localwave.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LocalWave
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "LocalWave uses Bluetooth to discover nearby teammates on the same Frequency Code and exchange encrypted messages without internet."
        INFOPLIST_KEY_UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        CODE_SIGN_ENTITLEMENTS: LocalWave/Resources/LocalWave.entitlements
    scheme:
      testTargets:
        - LocalWaveTests
  LocalWaveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocalWaveTests
    dependencies:
      - target: LocalWave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localwave.app.tests
        GENERATE_INFOPLIST_FILE: YES
